<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Motion Workshop · 可操作的介面動效</title><link rel="stylesheet" href="../website/style.css">
<style>
.tabs{display:flex;position:relative;gap:8px;flex-wrap:wrap;margin:32px 0 24px}.tabs button{position:relative;z-index:1;background:transparent;border-color:transparent}.indicator{position:absolute;top:0;left:0;height:100%;background:#d8f36a;border-radius:9px;transition:transform .32s cubic-bezier(.2,.8,.2,1),width .32s}button[aria-selected=true]{color:#10171c}.panel{max-width:720px;padding:30px;border:1px solid #36414a;border-radius:20px;background:#1a252d}.panel h2{margin-top:0}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}.card{padding:24px;border-radius:12px;background:#d8f36a;color:#10171c}.card:nth-child(2){background:#a59bff}.card:nth-child(3){background:#f4f1e8}#action{margin-top:22px;position:relative;overflow:hidden}#action .ripple{position:absolute;width:24px;height:24px;left:50%;top:50%;margin:-12px;border:2px solid #d8f36a;border-radius:50%;pointer-events:none}#result{min-height:2em}@media(prefers-reduced-motion:reduce){.indicator{transition:none}}
</style><body><main>
<p class="eyebrow">MOTION WORKSHOP / INTERACTIVE UI</p><h1>動作，跟著你的操作。</h1><p>把標籤滑塊、依序飛入與點擊回饋轉成實際 DOM 介面。支援滑鼠與鍵盤。</p>
<div class="tabs" role="tablist" aria-label="應用範例"><span class="indicator" aria-hidden="true"></span>
<button id="tab-overview" role="tab" aria-selected="true" aria-controls="panel-overview" tabindex="0">總覽</button>
<button id="tab-features" role="tab" aria-selected="false" aria-controls="panel-features" tabindex="-1">功能</button>
<button id="tab-workflow" role="tab" aria-selected="false" aria-controls="panel-workflow" tabindex="-1">流程</button></div>
<section class="panel" id="panel-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="0"><h2>一個動作，一個重點。</h2><p>動畫用來說明狀態與層級；主要內容在沒有動畫時仍然可閱讀。</p></section>
<section class="panel" id="panel-features" role="tabpanel" aria-labelledby="tab-features" tabindex="0" hidden><h2>為你的作品加入節奏</h2><div class="cards"><div class="card">網站動畫</div><div class="card">軟體介面</div><div class="card">影片分鏡</div></div></section>
<section class="panel" id="panel-workflow" role="tabpanel" aria-labelledby="tab-workflow" tabindex="0" hidden><h2>選型 → 改寫 → 驗證</h2><p>從效果目錄選擇技法，替換成真實內容，再檢查鍵盤、暫停與減少動態效果的設定。</p></section>
<button id="action" type="button">試試點擊回饋</button><p id="result" role="status">等待你的操作。</p>
